# Hosted mock demo: mock label reading, template briefs and fake payments. No secrets are needed or accepted.
services:
  - type: web
    name: recallrelay
    runtime: python
    plan: free
    buildCommand: pip install -r evidence/requirements.lock.txt
    startCommand: python -B -m evidence.integrated --port $PORT --public-host $RENDER_EXTERNAL_HOSTNAME --lose-first-refund-response
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
