name: Evidence lane
on:
  push:
    paths: ['evidence/**', 'contracts/**', 'requirements-dev.txt', '.github/workflows/evidence.yml']
  pull_request:
    paths: ['evidence/**', 'contracts/**', 'requirements-dev.txt', '.github/workflows/evidence.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -r evidence/requirements.lock.txt
      # Pin actual resolution source without merging or changing the other lane.
      - uses: actions/checkout@v4
        with:
          ref: e1e16be6928afcdd52015097a3bbab6b42ddbd8b
          path: .integration-resolution
          sparse-checkout: |
            resolution
            contracts
          persist-credentials: false
      - run: python -m unittest discover -s evidence/tests -v
        env:
          RECALLRELAY_RESOLUTION_SOURCE: ${{ github.workspace }}/.integration-resolution
      - run: python -m evidence.evals.run --check
      - run: node --test evidence/tests/test_web.js evidence/tests/test_label_review_web.js
