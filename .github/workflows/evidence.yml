name: Evidence lane
on:
  push:
    paths: ['evidence/**', 'contracts/**', 'requirements-dev.txt', '.github/workflows/evidence.yml']
  pull_request:
    paths: ['evidence/**', 'contracts/**', 'requirements-dev.txt', '.github/workflows/evidence.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -r evidence/requirements.lock.txt
      - run: python -m unittest discover -s evidence/tests -v
      - run: python -m evidence.evals.run --check
      - run: node --test evidence/tests/test_web.js
