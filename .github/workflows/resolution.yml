name: Resolution lane
on:
  push:
    paths: ['resolution/**', 'contracts/**', 'requirements-dev.txt', '.github/workflows/resolution.yml']
  pull_request:
    paths: ['resolution/**', 'contracts/**', 'requirements-dev.txt', '.github/workflows/resolution.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s resolution/tests -v
